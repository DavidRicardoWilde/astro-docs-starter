name: Documentation feedback
description: Report unclear instructions, a translation issue, or missing documentation.
title: "[Docs]: "
labels: [documentation]
body:
  - type: input
    id: page
    attributes:
      label: Page or file
      description: Paste the URL or repository path and include the language.
    validations:
      required: true
  - type: textarea
    id: feedback
    attributes:
      label: What needs updating?
      description: Point to the affected heading or text and describe what is missing or incorrect.
    validations:
      required: true
  - type: textarea
    id: suggested-change
    attributes:
      label: Suggested change
